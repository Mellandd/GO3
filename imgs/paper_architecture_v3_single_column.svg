<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1780" viewBox="0 0 1200 1780">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1f2937"/>
    </marker>
    <style>
      .bg { fill: #f8fafc; }
      .title { font: 700 50px 'Helvetica', 'Arial', sans-serif; fill: #0f172a; text-anchor: middle; }
      .sub { font: 500 24px 'Helvetica', 'Arial', sans-serif; fill: #334155; text-anchor: middle; }
      .box { rx: 18; ry: 18; stroke-width: 2.6; }
      .h { font: 700 32px 'Helvetica', 'Arial', sans-serif; fill: #0f172a; text-anchor: middle; }
      .t { font: 500 26px 'Helvetica', 'Arial', sans-serif; fill: #1f2937; }
      .arrow { stroke: #1f2937; stroke-width: 3.6; fill: none; marker-end: url(#arrow); }
      .foot { font: 500 22px 'Helvetica', 'Arial', sans-serif; fill: #475569; text-anchor: middle; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1200" height="1780"/>
  <text class="title" x="600" y="82">GO3 Architecture</text>
  <text class="sub" x="600" y="124">Single-column paper version</text>

  <rect class="box" x="120" y="190" width="960" height="230" fill="#dfeefe" stroke="#6e9dc6"/>
  <text class="h" x="600" y="250">1) Inputs and Loaders</text>
  <text class="t" x="168" y="304">load_go_terms(OBO), load_gaf(GAF), build_term_counter</text>
  <text class="t" x="168" y="352">ND/NOT filtering + obsolete-term normalization</text>

  <rect class="box" x="120" y="490" width="960" height="230" fill="#e8f5eb" stroke="#78a88d"/>
  <text class="h" x="600" y="550">2) Core Cached State</text>
  <text class="t" x="168" y="604">GO_TERMS_CACHE, GENE2GO_CACHE, ANCESTORS_CACHE, DCA_CACHE</text>
  <text class="t" x="168" y="652">TermCounter (counts + IC)</text>

  <rect class="box" x="120" y="790" width="960" height="280" fill="#fdeedc" stroke="#c99864"/>
  <text class="h" x="600" y="850">3) Semantic Engine</text>
  <text class="t" x="168" y="904">Term methods: resnik, lin, jc, simrel, iccoef, graphic, wang, topoicsim</text>
  <text class="t" x="168" y="952">Groupwise: bma, max, avg, hausdorff, simgic</text>
  <text class="t" x="168" y="1000">APIs: semantic_similarity, batch_similarity, compare_genes</text>

  <rect class="box" x="120" y="1140" width="960" height="230" fill="#eef2f7" stroke="#8d97a3"/>
  <text class="h" x="600" y="1200">4) Distance and Embeddings</text>
  <text class="t" x="168" y="1254">gene_distance_matrix, tsne_genes, umap_genes</text>
  <text class="t" x="168" y="1302">plot_tsne_genes, plot_umap_genes</text>

  <rect class="box" x="120" y="1440" width="960" height="210" fill="#f1f5f9" stroke="#9aa4b2"/>
  <text class="h" x="600" y="1500">5) Python API (PyO3)</text>
  <text class="t" x="168" y="1554">go3 module exposes classes + high-level workflows</text>
  <text class="t" x="168" y="1602">Outputs: similarity scores, distance matrices, embeddings, figures</text>

  <line class="arrow" x1="600" y1="420" x2="600" y2="490"/>
  <line class="arrow" x1="600" y1="720" x2="600" y2="790"/>
  <line class="arrow" x1="600" y1="1070" x2="600" y2="1140"/>
  <line class="arrow" x1="600" y1="1370" x2="600" y2="1440"/>

  <text class="foot" x="600" y="1730">Parallel execution (Rayon) and cache refresh on ontology reload.</text>
</svg>
